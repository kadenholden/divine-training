<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Divine's Training</title>
<meta name="theme-color" content="#1b1418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* VOICE: calm, premium, quick: Divine's own training app, native-feeling on her phone between sets.
   IDEA: the coach's training card, rebuilt as a live workout with one set in focus at a time.
   PICTURE: today's session: a dark hero card with the progress ring, then the exercise you're on, opened, with big steppers.
   COLOUR and TYPE: iOS greys or true black, a dark hero in both themes, one rose accent for progress, the log button and the rest timer; the phone's own system font.
   LAYOUT: one column up to 560px; the timer and Finish dock at the bottom; form guides slide up as a sheet. */
:root{color-scheme:light dark;--bg:light-dark(#f2f2f7,#000);--card:light-dark(#fff,#1c1c1e);--ink:light-dark(#111113,#f5f5f7);--mute:light-dark(#86868b,#98989f);--line:light-dark(#e3e3e8,#323235);--fill:light-dark(#f2f2f6,#2a2a2d);--acc:#e8456b;--accd:light-dark(#c0244f,#ff8fa8);--accs:light-dark(#fdedf1,#3a1320);--gear:light-dark(#cfcfd5,#4a4a50);--hero:#1b1418;--disp:-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,'Segoe UI',Roboto,sans-serif;--heroi:#f5f5f7;--herom:#a1a1a6}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip;padding-bottom:calc(170px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 16px 0}
.bar{display:flex;justify-content:space-between;align-items:center;min-height:52px}
.brand{font:700 20px var(--disp);letter-spacing:-.02em}
.seg{display:flex;background:var(--fill);border-radius:13px;padding:3px}
.seg button{border:0;background:transparent;color:var(--mute);font-weight:600;font-size:14px;border-radius:10px;padding:0 14px;min-height:40px}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hero{background:radial-gradient(110% 80% at 100% 0%,rgba(232,69,107,.34),rgba(232,69,107,0) 60%),var(--hero);color:var(--heroi);border-radius:26px;padding:20px 18px 18px;margin-top:4px}
.htop{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.kick{font-size:13px;color:var(--herom);font-weight:500}
.hero h1{font:700 30px/1.05 var(--disp);letter-spacing:-.025em;margin:6px 0 0;text-wrap:balance}
.ring{position:relative;width:78px;height:78px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.rt{fill:none;stroke:rgba(255,255,255,.12);stroke-width:7}
.rp{fill:none;stroke:var(--acc);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
.ring b{font:700 24px var(--disp);font-variant-numeric:tabular-nums}.ring span{font-size:11px;color:var(--herom);margin-top:3px}
.days{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:rgba(255,255,255,.07);border-radius:15px;padding:4px;margin:18px 0 16px}
.days button{position:relative;border:0;background:transparent;color:var(--herom);font-weight:600;font-size:14px;min-height:42px;border-radius:11px}
.days button[aria-pressed=true]{background:rgba(255,255,255,.16);color:#fff}
.days i{position:absolute;top:8px;right:10px;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats b{display:block;font:700 21px/1.1 var(--disp);font-variant-numeric:tabular-nums;white-space:nowrap}
.stats span{font-size:12px;color:var(--herom)}
.warm{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:0;border-radius:20px;padding:12px 16px;margin:10px 0 0;min-height:64px}
.wk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none}
.warm.on .wk{background:var(--ink);border-color:var(--ink);color:var(--card)}
.warm b,.exn b{display:block;font:600 17px/1.2 var(--disp);letter-spacing:-.01em}
.warm small,.exn small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.exlist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}
.ex{background:var(--card);border-radius:22px;scroll-margin-top:14px}
.exh{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;text-align:left;padding:14px 16px;min-height:68px}
.num{width:32px;height:32px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font:700 14px var(--disp);flex:none;color:var(--mute)}
.ex.open .num{background:var(--acc);color:#fff}
.num.ok,.ex.open .num.ok{background:var(--ink);color:var(--card)}
.exn{flex:1}
.ex.complete:not(.open) .exn b{color:var(--mute)}
.pips{display:flex;gap:4px;flex:none}.pips i{width:7px;height:7px;border-radius:50%;background:var(--line)}.pips i.on{background:var(--acc)}
.exb{padding:0 16px 16px}
.up{display:flex;gap:8px;align-items:center;background:var(--accs);color:var(--accd);font-weight:600;font-size:14px;border-radius:13px;padding:10px 12px;margin-bottom:10px}
.lastrow{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mute);padding:0 0 6px}
.lastrow span:last-child{font-variant-numeric:tabular-nums;text-align:right}
.cue{margin:0 0 12px;font-size:15px}
.howto{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--fill);border-radius:14px;padding:0 14px;min-height:48px;font-weight:600;font-size:15px}
.howto svg{flex:none}
.howto small{margin-left:auto;color:var(--mute);font-weight:500;font-size:13px}
.sets{margin-top:12px;display:grid;gap:6px}
.srow{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 26px;align-items:center;gap:8px;min-height:48px;padding:0 12px;border-radius:13px;border:0;background:transparent;font-weight:500;text-align:left;font-variant-numeric:tabular-nums;width:100%}
.srow.done{background:var(--fill)}
.srow.ghost{color:var(--mute);box-shadow:inset 0 0 0 1.5px var(--line)}
.sn{font:700 14px var(--disp);color:var(--mute)}
.sk{width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center}
.act{box-shadow:inset 0 0 0 2px var(--ink);border-radius:18px;padding:12px}
.actl{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mute);font-weight:500;margin:0 2px 10px}
.actl span:first-child{color:var(--ink);font-weight:600}
.stps{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px}
.stp{background:var(--fill);border-radius:15px;padding:8px}
.stpl{font-size:12px;color:var(--mute);font-weight:500;text-align:center;margin-bottom:4px}
.stpc{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center}
.sb{height:46px;border:0;border-radius:12px;background:var(--card);font-size:24px;line-height:1;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.sb:active{transform:scale(.94)}
.svw{display:flex;flex-direction:column;align-items:center;line-height:1}
.sv{width:100%;border:0;background:transparent;color:var(--ink);font:700 28px var(--disp);text-align:center;font-variant-numeric:tabular-nums;padding:0;min-height:34px;border-radius:8px}
.sv::placeholder{color:var(--mute)}
.svw span{font-size:12px;color:var(--mute)}
.log{width:100%;margin-top:10px;min-height:56px;border:0;border-radius:16px;background:var(--acc);color:#fff;font:600 17px var(--disp);letter-spacing:-.01em;transition:transform .12s}
.log:active{transform:scale(.98)}
.link{border:0;background:transparent;color:var(--accd);font-weight:600;font-size:14px;min-height:44px;padding:0 4px}
.alldone{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute);margin-top:4px;padding-left:4px}
.coolrow{text-align:center;color:var(--mute);font-size:14px;margin:16px 0}
.toast{background:var(--card);border-radius:16px;padding:12px 14px;margin:10px 0 0;font-size:14px}
.note{font-size:13px;color:var(--mute);margin:6px 2px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(12px + env(safe-area-inset-bottom));pointer-events:none;z-index:10}
.dock>*{max-width:528px;margin:0 auto;pointer-events:auto}
.timer{display:flex;align-items:center;gap:12px;background:var(--hero);color:var(--heroi);border-radius:24px;padding:10px 10px 10px 12px;box-shadow:0 12px 32px rgba(0,0,0,.28);margin-bottom:8px}
.tring{width:50px;height:50px;flex:none}.tring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tring .rp{transition:stroke-dashoffset .25s linear}
.tinfo{flex:1}
.tt{font:700 26px/1 var(--disp);font-variant-numeric:tabular-nums}
.tl{font-size:12px;color:var(--herom);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer button{min-height:44px;border-radius:14px;border:0;background:rgba(255,255,255,.12);color:#fff;font-weight:600;font-size:14px;padding:0 12px;flex:none}
.timer.end{background:var(--acc)}.timer.end .tl{color:#fff}.timer.end .rt{stroke:rgba(255,255,255,.3)}.timer.end .rp{stroke:#fff}
.fin{width:100%;min-height:56px;border-radius:18px;border:0;background:var(--ink);color:var(--bg);font:600 17px var(--disp);box-shadow:0 12px 32px rgba(0,0,0,.2)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .25s;z-index:20}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:600px;margin:0 auto;background:var(--card);border-radius:28px 28px 0 0;padding:8px 0 calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow-y:auto;overscroll-behavior:contain}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 6px}
.shh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:4px 20px 10px}
.shh small{color:var(--mute);font-size:13px;font-weight:500}.shh h2{font:700 24px/1.1 var(--disp);letter-spacing:-.02em;margin:3px 0 0}
.x{width:44px;height:44px;border-radius:50%;border:0;background:var(--fill);font-size:22px;line-height:1;flex:none}
.car{display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 20px 6px;scroll-padding:0 20px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.frm{flex:0 0 100%;scroll-snap-align:start;margin:0;background:var(--fill);border-radius:22px;padding:8px 8px 14px}
.frm:only-child{flex-basis:100%}
.frm svg{width:100%;height:auto;display:block}
.frm figcaption{display:flex;gap:10px;font-size:15px;line-height:1.4;padding:2px 8px 0}
.frm figcaption b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font:700 13px var(--disp);margin-top:-1px}
.carnav{display:flex;align-items:center;justify-content:center;gap:14px;padding:6px 20px 2px}
.carnav button{width:44px;height:44px;border-radius:50%;border:0;background:var(--fill);font-size:22px}
.cdots{display:flex;gap:6px}.cdots i{width:7px;height:7px;border-radius:4px;background:var(--line);transition:width .2s}.cdots i.on{background:var(--ink);width:20px}
.shcue{margin:10px 20px 0;padding:12px 14px;border-radius:14px;background:var(--accs);font-size:15px}
.shcue b{display:block;font-size:12px;color:var(--accd);margin-bottom:2px}
.shpad{padding:0 20px}
.sumgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
.sumgrid div{background:var(--fill);border-radius:16px;padding:12px 14px}
.sumgrid b{display:block;font:700 24px/1.1 var(--disp);font-variant-numeric:tabular-nums}
.sumgrid span{font-size:13px;color:var(--mute)}
.btn{width:100%;min-height:56px;border-radius:16px;border:0;background:var(--acc);color:#fff;font:600 17px var(--disp);margin-top:8px}
.btn.ghost{background:var(--fill);color:var(--ink)}
.fig .lb{stroke:var(--ink);fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .lf{stroke:var(--ink);opacity:.26;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .halo{stroke:var(--fill);fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .hd,.fig .tor{fill:var(--ink)}.fig .tor{stroke:var(--ink);stroke-linejoin:round}
.fig .eq{fill:var(--acc)}.fig .eqf{fill:var(--acc);opacity:.4}.fig .eqfg{opacity:.4}.fig .eqs{stroke:var(--acc);fill:none;stroke-linecap:round}
.fig .gr{stroke:var(--line);stroke-width:2}.fig .gear,.fig .gearc{fill:var(--gear)}.fig .gears{stroke:var(--gear);fill:none;stroke-linecap:round}.fig .gearr{stroke:var(--gear);fill:none;stroke-width:4}.fig .ln{stroke:var(--acc);stroke-width:1.6}
.done-hero{background:var(--hero);color:var(--heroi);border-radius:26px;padding:28px 20px 22px;margin-top:4px;text-align:center;background-image:radial-gradient(90% 70% at 50% 0%,rgba(232,69,107,.36),rgba(232,69,107,0) 70%)}
.bigcheck{width:68px;height:68px;border-radius:50%;background:var(--acc);display:grid;place-items:center;margin:0 auto 14px}
.done-hero h1{font:700 30px/1.05 var(--disp);letter-spacing:-.025em;margin:0}
.done-hero p{color:var(--herom);margin:6px 0 0}
.done-hero .sumgrid div{background:rgba(255,255,255,.08);text-align:left}.done-hero .sumgrid span{color:var(--herom)}
.card{background:var(--card);border-radius:22px;padding:16px;margin-top:10px}
.card h3{font:600 17px var(--disp);margin:0 0 6px}
.uprow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.uprow b{color:var(--accd);white-space:nowrap}
.hsess{background:var(--card);border-radius:20px;margin-top:10px}
.hsess summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:64px}
.hsess summary::-webkit-details-marker{display:none}
.hsess summary b{display:block;font:600 17px var(--disp)}
.hsess summary small{color:var(--mute);font-size:13px}
.hsess summary em{font-style:normal;color:var(--mute);font-size:13px;text-align:right;white-space:nowrap}
.hsess ul{list-style:none;margin:0;padding:0 16px 8px}
.hsess li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.hsess li em{font-style:normal;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.sect{font:700 22px var(--disp);letter-spacing:-.02em;margin:24px 2px 2px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 72px auto;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.prow:first-of-type{border-top:0}
.prow em{font-style:normal;color:var(--mute);font-size:13px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.prow svg{width:72px;height:26px}
.empty{background:var(--card);border-radius:22px;padding:22px;color:var(--mute);text-align:center;margin-top:10px}
.altrow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--mute);margin-top:10px;padding:0 2px}
.altrow b{color:var(--ink);font-weight:600}
.altrow .link{display:inline-flex;gap:5px;align-items:center;flex:none}
.link:disabled{opacity:.4}
.tip{background:var(--fill);border-radius:14px;padding:12px 14px;margin:0 0 10px;font-size:15px}.tip strong{display:block;margin-bottom:2px}
.ta{width:100%;margin-top:10px;border:0;border-radius:14px;background:var(--fill);color:var(--ink);font-size:16px;line-height:1.4;font-family:inherit;padding:12px;resize:vertical}
.fig .hub{fill:var(--fill)}
@media(max-width:370px){.hero h1{font-size:26px}.stats b{font-size:18px}.pips{display:none}}
@media(prefers-reduced-motion:reduce){.sheet,.scrim,.rp,.cdots i,.log{transition:none}}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="brand">Training<span style="color:var(--mute);font-weight:500"> · Divine</span></div>
    <div class="seg" role="group" aria-label="View"><button id="vT" aria-pressed="true">Today</button><button id="vH" aria-pressed="false">History</button></div>
  </div>
  <div id="status" class="note" hidden></div>
  <main id="main"></main>
</div>
<div class="dock">
  <div class="timer" id="timer" hidden role="timer" aria-live="polite">
    <div class="tring"><svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="21" class="rt" style="stroke-width:5"/><circle id="tP" cx="25" cy="25" r="21" class="rp" style="stroke-width:5" stroke-dasharray="131.9" stroke-dashoffset="0"/></svg></div>
    <div class="tinfo"><div class="tt" id="tT">1:30</div><div class="tl" id="tL">Rest</div></div>
    <button id="tPlus">+15s</button><button id="tSkip">Skip</button>
  </div>
  <div id="finbar" hidden><button class="fin" id="finBtn">Finish workout</button></div>
</div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT" hidden><div class="grab"></div><div id="sheetB"></div></div>
<script>
/* Form guide figures: pictogram poses drawn as SVG from joint angles. Angles: 0 = up, 90 = forward (right), 180 = down. */
const FIG=(()=>{
const L={T:42,UA:25,FA:23,TH:33,SH:32,F:10,HR:9.5},GR=166,RAD=Math.PI/180;
const D=a=>[Math.sin(a*RAD),-Math.cos(a*RAD)];
const mv=(p,a,l)=>{const d=D(a);return[p[0]+d[0]*l,p[1]+d[1]*l]};
const f=n=>n.toFixed(1);
function ik(S,H,a,b,s){const dx=H[0]-S[0],dy=H[1]-S[1];let d=Math.hypot(dx,dy);const base=Math.atan2(dy,dx);
 if(d>=a+b-.5)return[[S[0]+Math.cos(base)*a,S[1]+Math.sin(base)*a],[S[0]+Math.cos(base)*(a+b),S[1]+Math.sin(base)*(a+b)]];
 d=Math.max(d,Math.abs(a-b)+1);const A=Math.acos(Math.min(1,(a*a+d*d-b*b)/(2*a*d)));return[[S[0]+Math.cos(base+s*A)*a,S[1]+Math.sin(base+s*A)*a],H]}
const BIG=['hip','sh','nk','shR','shL','hipR','hipL'];
function place(P,o){let maxY=-1e9,minX=1e9,maxX=-1e9;
 for(const k in P){const p=P[k],pad=k==='hd'?L.HR:BIG.includes(k)?4.5:3.5;maxY=Math.max(maxY,p[1]+pad);minX=Math.min(minX,p[0]-pad);maxX=Math.max(maxX,p[0]+pad)}
 const dy=GR-(o.lift||0)-maxY,dx=(o.cx??100)-(minX+maxX)/2;
 for(const k in P)P[k]=[P[k][0]+dx,P[k][1]+dy];P._minX=minX+dx;P._maxX=maxX+dx;return P}
function side(o){const P={},hip=[0,0];P.hip=hip;P.sh=mv(hip,o.t,L.T);P.hd=mv(P.sh,o.t,5+L.HR);
 const arm=(a,k)=>{a=a||o.a1;P['e'+k]=mv(P.sh,a[0],L.UA*(a[2]??1));P['h'+k]=mv(P['e'+k],a[1],L.FA*(a[3]??1))};arm(o.a1,1);arm(o.a2,2);
 const leg=(l,k,ft)=>{P['k'+k]=mv(hip,l[0],L.TH*(l[2]??1));P['a'+k]=mv(P['k'+k],l[1],L.SH);P['t'+k]=mv(P['a'+k],ft??(l[1]-90),L.F)};

];
const KEY='divineTraining.v1',U={reps:'reps',sec:'sec',min:'min',m:'m'},UL={reps:'Reps',sec:'Seconds',min:'Minutes',m:'Metres'},RSTEP={reps:1,sec:5,min:1,m:5};
const IC={check:'<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
 up:'<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
 how:'<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="4.5" r="2.5" fill="var(--acc)"/><path d="M11 8v6M11 14l-3.5 5M11 14l3.5 5M5.5 10.5l5.5-1.5 5.5 1.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
 swap:'<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 5h9l-2.5-2.5M13 11H4l2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'};
const $=s=>document.querySelector(s),main=$('#main');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtD=s=>new Date(s+'T12:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const num=v=>v===''||v==null||isNaN(+v)?null:+v;
const fw=v=>{const n=num(v);return n==null?'':String(+n.toFixed(2))};
const range=ex=>ex.lo===ex.hi?ex.hi:ex.lo+'–'+ex.hi;
const dur=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?h+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'):m+':'+String(x).padStart(2,'0')};
const kg=n=>Math.round(n).toLocaleString('en-GB');
const BASE=id=>{for(const p of P){const e=p.ex.find(x=>x.id===id);if(e)return e}};
const X=(id,alt)=>{const e=BASE(id);if(!e)return null;return alt&&e.alt?{...e,n:e.alt,lo:e.altLo??e.lo,hi:e.altHi??e.hi,side:e.altSide??e.side,w:undefined,wn:undefined,isAlt:1}:e};
const isAlt=(d,id)=>!!(d.alt&&d.alt[id]);
let sessions=[],drafts={},day=null,view='today',open=null,edit=null,summary=null,saveT=null,lastFocus=null;
function load(){try{const o=JSON.parse(localStorage.getItem(KEY)||'{}');sessions=o.sessions||[];drafts=o.drafts||{}}catch(e){sessions=[];drafts={}}sessions.sort((a,b)=>String(b.finishedAt).localeCompare(String(a.finishedAt)))}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({sessions,drafts}));return true}catch(e){return false}}
function flag(k,v){try{if(v===undefined)return localStorage.getItem(KEY+'.'+k);localStorage.setItem(KEY+'.'+k,v)}catch(e){return null}}

function lastFor(id,alt){for(const s of sessions){const e=(s.entries||[]).find(e=>e.id===id&&!!e.alt===!!alt);if(e&&e.sets.some(x=>x.done))return{date:s.date,sets:e.sets.filter(x=>x.done)}}return null}
function hitTop(ex,l){if(!l||l.sets.length<ex.s)return false;if(ex.nw&&ex.lo===ex.hi)return false;return l.sets.every(x=>(num(x.r)||0)>=ex.hi)}
const topW=l=>Math.max(0,...l.sets.map(x=>num(x.w)||0));
function suggest(ex){const l=lastFor(ex.id,ex.isAlt);
 if(ex.nw)return{w:'',up:hitTop(ex,l)&&ex.u!=='m'?'You hit '+ex.hi+' '+U[ex.u]+' last time. Try a little more today.':'',go:false};
 if(!l)return{w:ex.w??'',up:'',go:false};const t=topW(l);
 if(hitTop(ex,l)&&t){const n=+(t+ex.step).toFixed(2);return{w:n,up:'Top of the range last time. Go up to '+n+' kg today.',go:true}}
 if(hitTop(ex,l)&&!t)return{w:'',up:'Top of the range last time. Add a little weight if you can.',go:true};
 return{w:t||ex.w||'',up:'',go:false}}
function nextDay(){if(!sessions.length)return 1;const d=sessions[0].day;return d>=3?1:d+1}
function freshSets(ex){const g=suggest(ex),l=lastFor(ex.id,ex.isAlt);return Array.from({length:ex.s},(_,i)=>({w:g.w,r:String(!g.go&&l&&l.sets[i]&&num(l.sets[i].r)!=null?l.sets[i].r:ex.lo),done:false}))}
function getDraft(d){if(!drafts[d]){const sets={};for(const ex of P[d-1].ex)sets[ex.id]=freshSets(ex);drafts[d]={day:d,date:today(),sets,alt:{},warm:false,started:null}}if(!drafts[d].alt)drafts[d].alt={};return drafts[d]}
function weekCount(){const m=new Date();m.setHours(0,0,0,0);m.setDate(m.getDate()-((m.getDay()+6)%7));return sessions.filter(s=>new Date(s.date+'T12:00')>=m).length}
function firstOpen(d){const ex=P[d.day-1].ex.find(e=>d.sets[e.id].some(s=>!s.done));return ex?ex.id:''}
function vol(entries){let v=0;for(const e of entries){const ex=X(e.id,e.alt);if(!ex||ex.u!=='reps')continue;for(const s of e.sets)if(s.done)v+=(num(s.w)||0)*(num(s.r)||0)*(ex.each?2:1)}return v}
const draftEntries=d=>P[d.day-1].ex.map(ex=>({id:ex.id,alt:isAlt(d,ex.id),sets:d.sets[ex.id]}));
const ringSvg=f=>{const C=2*Math.PI*27;return `<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="27" class="rt"/><circle cx="32" cy="32" r="27" class="rp" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-Math.min(1,f))).toFixed(1)}"/></svg>`};

function stepper(k,ex,i,v){const u=k==='w'?'kg':U[ex.u],lab=k==='w'?'Weight':UL[ex.u];
 return `<div class="stp"><div class="stpl">${lab}</div><div class="stpc"><button class="sb" data-st="${k}" data-ex="${ex.id}" data-i="${i}" data-d="-1" aria-label="Less ${lab.toLowerCase()}">−</button><label class="svw"><input class="sv" id="in-${ex.id}-${i}-${k}" data-ex="${ex.id}" data-i="${i}" data-k="${k}" inputmode="${k==='w'?'decimal':'numeric'}" value="${esc(k==='w'?fw(v):v)}" placeholder="–" aria-label="${lab}"><span>${u}</span></label><button class="sb" data-st="${k}" data-ex="${ex.id}" data-i="${i}" data-d="1" aria-label="More ${lab.toLowerCase()}">+</button></div></div>`}

function card(base,idx,d){const ex=X(base.id,isAlt(d,base.id)),sets=d.sets[ex.id],nd=sets.filter(s=>s.done).length,complete=nd>=sets.length,isOpen=open===ex.id;
 const w0=sets.find(s=>num(s.w)!=null),tgt=sets.length+' × '+range(ex)+(ex.u==='reps'?'':' '+U[ex.u])+(ex.side?' each side':'')+(!ex.nw&&w0?' · '+fw(w0.w)+' kg':'');
 const head=`<button class="exh" data-open="${ex.id}" aria-expanded="${isOpen}"><span class="num${complete?' ok':''}">${complete?IC.check:idx+1}</span><span class="exn"><b>${esc(ex.n)}</b><small>${esc(tgt)}</small></span><span class="pips" aria-label="${nd} of ${sets.length} sets done">${sets.map(s=>`<i class="${s.done?'on':''}"></i>`).join('')}</span></button>`;
 if(!isOpen)return `<li class="ex${complete?' complete':''}" id="ex-${ex.id}">${head}</li>`;
 const g=suggest(ex),l=lastFor(ex.id,ex.isAlt),gs=ex.isAlt?null:FIG.G[ex.id];
 const ai=edit&&edit.ex===ex.id?edit.i:sets.findIndex(s=>!s.done);
 const rows=sets.map((s,i)=>{if(i===ai)return `<div class="act"><div class="actl"><span>Set ${i+1} of ${sets.length}</span><span>Target ${range(ex)} ${U[ex.u]}${ex.side?' each side':''}</span></div><div class="stps">${ex.nw?'':stepper('w',ex,i,s.w)}${stepper('r',ex,i,s.r)}</div><button class="log" data-log="${ex.id}" data-i="${i}">${s.done?'Update set '+(i+1):'Log set '+(i+1)}</button>${s.done?`<div style="text-align:center"><button class="link" data-untick="${ex.id}" data-i="${i}">Mark as not done</button></div>`:''}</div>`;
  if(s.done)return `<button class="srow done" data-edit="${ex.id}" data-i="${i}" aria-label="Edit set ${i+1}"><span class="sn">${i+1}</span><span>${ex.nw?'':num(s.w)==null?'–':esc(fw(s.w))+' kg'}</span><span>${esc(s.r)} ${U[ex.u]}</span><span class="sk">${IC.check}</span></button>`;
  return `<div class="srow ghost"><span class="sn">${i+1}</span><span>${ex.nw||num(s.w)==null?'':esc(fw(s.w))+' kg'}</span><span>${range(ex)} ${U[ex.u]}</span><span></span></div>`}).join('');
 const altRow=base.alt?`<div class="altrow"><span>${ex.isAlt?'Doing the alternative instead of <b>'+esc(base.n)+'</b>':'Machine busy? Alternative: <b>'+esc(base.alt)+'</b>'}</span><button class="link" data-swap="${ex.id}"${nd?' disabled title="Untick your sets first"':''}>${IC.swap} ${ex.isAlt?'Switch back':'Swap'}</button></div>`:'';
 const lastTxt=l?'Last time · '+fmtD(l.date):(ex.wn?'Start with '+ex.wn:'First time on this one');
 return `<li class="ex open${complete?' complete':''}" id="ex-${ex.id}">${head}<div class="exb">${g.up?`<div class="up">${IC.up}<span>${esc(g.up)}</span></div>`:''}<div class="lastrow"><span>${esc(lastTxt)}</span><span>${l?esc(l.sets.map(x=>(ex.nw?'':fw(x.w)+'×')+x.r).join('  ')):''}</span></div><p class="cue">${esc(ex.cue)}</p>${gs?`<button class="howto" data-guide="${ex.id}">${IC.how}<span>How to do it</span><small>${gs.length} pictures</small></button>`:''}${altRow}<div class="sets">${rows}</div>${complete&&ai<0?`<div class="alldone"><span>All ${sets.length} sets done</span><button class="link" data-addset="${ex.id}">Add a set</button></div>`:''}</div></li>`}

function renderToday(){const nd=nextDay();if(!day)day=nd;const d=getDraft(day),pd=P[day-1];
 if(open===null)open=firstOpen(d);
 const tot=pd.ex.reduce((a,e)=>a+d.sets[e.id].length,0),dn=pd.ex.reduce((a,e)=>a+d.sets[e.id].filter(s=>s.done).length,0);
 const el=d.started?dur((Date.now()-new Date(d.started))/1000):'0:00';
 main.innerHTML=`<section class="hero"><div class="htop"><div><div class="kick">${pd.opt?'Optional extra day':'Day '+day+' of 3'}${day===nd?' · Up next':''}</div><h1>${esc(pd.name)}</h1></div><div class="ring">${ringSvg(tot?dn/tot:0)}<div><b>${dn}</b><span>of ${tot} sets</span></div></div></div>
 <div class="days" role="group" aria-label="Training day">${[1,2,3,4].map(i=>`<button data-day="${i}" aria-pressed="${i===day}">${i===4?'Extra':'Day '+i}${i===nd?'<i aria-label="up next"></i>':''}</button>`).join('')}</div>
 <div class="stats"><div><b id="elapsed">${el}</b><span>Time</span></div><div><b>${kg(vol(draftEntries(d)))}</b><span>kg lifted</span></div><div><b>${weekCount()} of 3</b><span>This week</span></div></div></section>
 <button class="warm${d.warm?' on':''}" data-warm aria-pressed="${!!d.warm}"><span class="wk">${IC.check}</span><span><b>Warm-up</b><small>${esc(pd.warm)}</small></span></button>
 <ol class="exlist">${pd.ex.map((ex,i)=>card(ex,i,d)).join('')}</ol><p class="coolrow">Then cool down and stretch.</p>`;
 $('#finbar').hidden=!dn}

function renderSummary(){const s=summary,p=P[s.day-1],n=s.entries.reduce((a,e)=>a+e.sets.filter(x=>x.done).length,0);
 const ups=s.entries.map(e=>{const ex=X(e.id,e.alt);if(!ex||ex.nw)return null;const l={sets:e.sets.filter(x=>x.done)};return hitTop(ex,l)&&topW(l)?{n:ex.n,w:+(topW(l)+ex.step).toFixed(2)}:null}).filter(Boolean);
 const wc=weekCount();
 main.innerHTML=`<section class="done-hero"><div class="bigcheck"><svg width="30" height="30" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.5l3 3 6-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h1>${wc>=3?'Week done. Brilliant.':'Workout saved'}</h1><p>${p.opt?'Extra day':'Day '+s.day} · ${esc(p.name)}</p>
 <div class="sumgrid"><div><b>${s.duration?dur(s.duration):'–'}</b><span>Time</span></div><div><b>${n}</b><span>Sets</span></div><div><b>${kg(s.volume||0)}</b><span>kg lifted</span></div><div><b>${wc} of 3</b><span>This week</span></div></div></section>
 ${ups.length?`<div class="card"><h3>Going up next time</h3>${ups.map(u=>`<div class="uprow"><span>${esc(u.n)}</span><b>${u.w} kg</b></div>`).join('')}</div>`:''}
 <button class="btn" data-home>Done</button>`;$('#finbar').hidden=true}

function spark(vals){if(vals.length<2)return '<svg viewBox="0 0 72 26"></svg>';const mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;
 const pts=vals.map((v,i)=>[(i/(vals.length-1))*68+2,22-((v-mn)/r)*18]);return `<svg viewBox="0 0 72 26" aria-hidden="true"><polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--acc)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="3" fill="var(--acc)"/></svg>`}
function renderHistory(){$('#finbar').hidden=true;
 const backup=`<h2 class="sect">Your data</h2><div class="card"><p class="note" style="margin:0 0 6px">Everything you log is saved on this phone only. It isn’t sent anywhere. Save a backup now and then, in case you change phones or clear your browser.</p><button class="btn ghost" data-backup>Save a backup</button><button class="btn ghost" data-restore>Restore from a backup</button></div>`;
 if(!sessions.length){main.innerHTML='<div class="empty">No workouts saved yet.<br>Finish one on the Today tab and it shows here, with how each exercise is going.</div>'+backup;return}
 const list=sessions.map(s=>{const p=P[s.day-1]||{name:''},n=(s.entries||[]).reduce((a,e)=>a+e.sets.filter(x=>x.done).length,0);
  const items=(s.entries||[]).filter(e=>e.sets.some(x=>x.done)).map(e=>{const ex=X(e.id,e.alt)||{n:e.id,u:'reps'},ds=e.sets.filter(x=>x.done);return `<li><span>${esc(ex.n)}</span><em>${ex.nw?esc(ds.map(x=>x.r).join(', '))+' '+U[ex.u]:(topW({sets:ds})?esc(fw(topW({sets:ds})))+' kg · ':'')+esc(ds.map(x=>x.r).join(', '))+(ex.u==='reps'?'':' '+U[ex.u])}</em></li>`}).join('');
  return `<details class="hsess"><summary><span><b>${fmtD(s.date)}</b><small>${p.opt?'Extra day':'Day '+esc(s.day)} · ${esc(p.name)}</small></span><em>${n} sets${s.duration?'<br>'+dur(s.duration):''}</em></summary><ul>${items}</ul><div class="shpad" style="padding-bottom:12px"><button class="link" data-del="${esc(s.id)}">Delete this workout</button></div></details>`}).join('');
 const chrono=[...sessions].reverse(),keys=[];
 for(const p of P)for(const e of p.ex){if(e.nw)continue;keys.push([e.id,false]);if(e.alt)keys.push([e.id,true])}
 const prog=keys.map(([id,alt])=>{const ex=X(id,alt);const hs=chrono.map(s=>{const e=(s.entries||[]).find(e=>e.id===id&&!!e.alt===alt);return e&&e.sets.some(x=>x.done)?topW({sets:e.sets.filter(x=>x.done)}):null}).filter(v=>v!=null&&v>0);
  if(!hs.length)return '';return `<div class="prow"><span>${esc(ex.n)}</span>${spark(hs)}<em>${hs.length>1&&hs[0]!==hs[hs.length-1]?fw(hs[0])+' → ':''}${fw(hs[hs.length-1])} kg</em></div>`}).join('');
 main.innerHTML=`<h2 class="sect" style="margin-top:6px">Workouts</h2>${list}${prog?`<h2 class="sect">Progress</h2><p class="note">Heaviest set each time, first to latest.</p><div class="card">${prog}</div>`:''}${backup}`}

function render(){$('#vT').setAttribute('aria-pressed',view!=='hist');$('#vH').setAttribute('aria-pressed',view==='hist');
 if(view==='hist')renderHistory();else if(summary)renderSummary();else renderToday()}
function saveDraft(){clearTimeout(saveT);saveT=setTimeout(persist,400)}
setInterval(()=>{const e=$('#elapsed');if(e&&day&&drafts[day]&&drafts[day].started)e.textContent=dur((Date.now()-new Date(drafts[day].started))/1000)},1000);

/* rest timer */
let tEnd=0,tLen=0,tI=null;const TC=2*Math.PI*21;
function startRest(sec,label){if(!sec)return;tLen=sec;tEnd=Date.now()+sec*1000;$('#tL').textContent=label;const t=$('#timer');t.hidden=false;t.classList.remove('end');clearInterval(tI);tI=setInterval(tick,250);tick()}
function tick(){const left=Math.max(0,(tEnd-Date.now())/1000),s=Math.ceil(left);$('#tT').textContent=s?dur(s):'Go';$('#tP').setAttribute('stroke-dashoffset',(TC*(1-(tLen?left/tLen:0))).toFixed(1));
 if(!s){$('#timer').classList.add('end');clearInterval(tI);try{navigator.vibrate&&navigator.vibrate([180,90,180])}catch(e){}}}
$('#tPlus').onclick=()=>{if(Date.now()>tEnd){tEnd=Date.now();tLen=0}tEnd+=15000;tLen+=15;$('#timer').classList.remove('end');clearInterval(tI);tI=setInterval(tick,250);tick()};
$('#tSkip').onclick=()=>{clearInterval(tI);$('#timer').hidden=true};

/* sheet */
function openSheet(html){lastFocus=document.activeElement;$('#sheetB').innerHTML=html;const sh=$('#sheet'),sc=$('#scrim');sh.hidden=false;sc.hidden=false;sh.scrollTop=0;requestAnimationFrame(()=>requestAnimationFrame(()=>{sh.classList.add('on');sc.classList.add('on')}));setTimeout(()=>{const x=sh.querySelector('[data-close]');x&&x.focus()},60)}
function closeSheet(){const sh=$('#sheet'),sc=$('#scrim');sh.classList.remove('on');sc.classList.remove('on');setTimeout(()=>{sh.hidden=true;sc.hidden=true;$('#sheetB').innerHTML=''},320);lastFocus&&lastFocus.focus&&lastFocus.focus()}
function guide(id){const ex=BASE(id),gs=FIG.G[id];if(!gs)return;
 openSheet(`<div class="shh"><div><small>How to do it</small><h2 id="sheetT">${esc(ex.n)}</h2></div><button class="x" data-close aria-label="Close">×</button></div>
 <div class="car" id="car" tabindex="0" aria-label="Pictures, swipe for the next">${gs.map((fr,i)=>`<figure class="frm">${FIG.svg(fr)}<figcaption><b>${i+1}</b><span>${esc(fr.c)}</span></figcaption></figure>`).join('')}</div>
 ${gs.length>1?`<div class="carnav"><button data-car="-1" aria-label="Previous picture">‹</button><div class="cdots">${gs.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div><button data-car="1" aria-label="Next picture">›</button></div>`:''}
 <div class="shcue"><b>Coach’s cue</b>${esc(ex.cue)}</div><p class="note shpad" style="margin-top:10px">Pictures are a reminder of the movement. Ask an instructor to show you if you’re unsure.</p>`);
 const car=$('#car');car.addEventListener('scroll',()=>{const i=carIdx();document.querySelectorAll('.cdots i').forEach((d,j)=>d.classList.toggle('on',j===i))},{passive:true})}
function carIdx(){const car=$('#car');if(!car)return 0;return Math.round(car.scrollLeft/(car.children[0].offsetWidth+24))}
function carGo(dir){const car=$('#car');if(!car)return;const i=Math.max(0,Math.min(car.children.length-1,carIdx()+dir));car.children[i].scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest',inline:'start'})}
function finishSheet(){const d=getDraft(day),es=draftEntries(d),n=es.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0),tot=es.reduce((a,e)=>a+e.sets.length,0);
 openSheet(`<div class="shh"><div><small>${P[day-1].opt?'Extra day':'Day '+day} · ${esc(P[day-1].name)}</small><h2 id="sheetT">Finish workout?</h2></div><button class="x" data-close aria-label="Close">×</button></div>
 <div class="shpad"><div class="sumgrid"><div><b>${n} of ${tot}</b><span>Sets done</span></div><div><b>${d.started?dur((Date.now()-new Date(d.started))/1000):'–'}</b><span>Time</span></div></div>
 ${n<tot?`<p class="note">${tot-n} sets aren’t logged. They’ll be left out.</p>`:''}<button class="btn" id="saveW">Save workout</button><button class="btn ghost" data-close>Keep going</button></div>`)}
function saveWorkout(btn){const d=getDraft(day),entries=P[day-1].ex.map(b=>{const alt=isAlt(d,b.id),ex=X(b.id,alt);return{id:b.id,alt,sets:d.sets[b.id].map(s=>({w:ex.nw?null:num(s.w),r:num(s.r),done:!!s.done}))}});
 const id=today()+'-d'+day+'-'+Date.now().toString(36),doc={id,date:today(),day,entries,finishedAt:new Date().toISOString(),startedAt:d.started||null,duration:d.started?Math.round((Date.now()-new Date(d.started))/1000):null,volume:Math.round(vol(entries)),warm:!!d.warm};
 sessions=[doc,...sessions];delete drafts[day];
 if(!persist()){sessions=sessions.slice(1);drafts[day]=d;btn.textContent='Couldn’t save. Try again';return}
 summary=doc;day=null;open=null;edit=null;closeSheet();$('#timer').hidden=true;clearInterval(tI);render();window.scrollTo(0,0)}

/* backup */
function backupText(){return JSON.stringify({app:'divine-training',version:1,exportedAt:new Date().toISOString(),sessions,drafts})}
async function doBackup(){const txt=backupText(),name='training-backup-'+today()+'.json';
 try{const f=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Training backup'});return}}catch(e){if(e&&e.name==='AbortError')return}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}catch(e){}
 openSheet(`<div class="shh"><div><small>Backup</small><h2 id="sheetT">Backup saved</h2></div><button class="x" data-close aria-label="Close">×</button></div><div class="shpad"><p class="note">If no file appeared, copy the backup instead and keep it somewhere safe, like your Notes app.</p><button class="btn ghost" data-copy>Copy backup</button><button class="btn" data-close>Done</button></div>`)}
function restoreSheet(){openSheet(`<div class="shh"><div><small>Backup</small><h2 id="sheetT">Restore from a backup</h2></div><button class="x" data-close aria-label="Close">×</button></div><div class="shpad"><p class="note">Pick a backup file, or paste the backup text below. This replaces what’s on this phone now.</p><label class="btn ghost" style="display:grid;place-items:center">Choose a backup file<input type="file" id="rFile" accept=".json,application/json,text/plain" hidden></label><textarea id="rText" class="ta" rows="4" placeholder="Or paste backup text here"></textarea><p class="note" id="rMsg" role="status"></p><button class="btn" id="rGo">Restore</button></div>`);
 $('#rFile').onchange=async e=>{const f=e.target.files[0];if(f)$('#rText').value=await f.text()}}
function doRestore(){const msg=$('#rMsg');try{const o=JSON.parse($('#rText').value);if(o.app!=='divine-training'||!Array.isArray(o.sessions))throw 0;sessions=o.sessions;drafts=o.drafts||{};sessions.sort((a,b)=>String(b.finishedAt).localeCompare(String(a.finishedAt)));persist();day=null;open=null;closeSheet();render()}catch(e){msg.textContent='That doesn’t look like a training backup. Check you copied all of it.'}}

/* welcome */
function welcome(){const ios=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
 openSheet(`<div class="shh"><div><small>Your training app</small><h2 id="sheetT">Welcome, Divine</h2></div><button class="x" data-close aria-label="Close">×</button></div><div class="shpad">
 <p style="margin:0 0 12px">This is your Training Programme 1, ready to log at the gym. Open the day, do your warm-up, then log each set. It tells you when to go up a weight.</p>
 ${standalone?'':`<div class="tip"><strong>Put it on your Home Screen</strong>${ios?'In Safari, tap the Share button, then <b>Add to Home Screen</b>. It then opens like an app.':'In Chrome, tap the ⋮ menu, then <b>Add to Home screen</b> or <b>Install app</b>. It then opens like an app.'}</div>`}
 <div class="tip"><strong>Private to you</strong>Everything you log stays on this phone. It isn’t sent anywhere, and there’s no account or password.</div>
 <button class="btn" data-close>Let’s go</button></div>`);flag('welcomed','1')}

function logSet(id,i){const d=getDraft(day),ex=X(id,isAlt(d,id)),s=d.sets[id][i];if(num(s.r)==null)s.r=String(ex.lo);
 const was=s.done;s.done=true;d.touched=1;const ss=d.sets[id];if(!ex.nw&&num(s.w)!=null)for(let j=i+1;j<ss.length;j++)if(!ss[j].done)ss[j].w=s.w;if(!d.started)d.started=new Date().toISOString();edit=null;
 const complete=ss.every(x=>x.done);let adv=false;
 if(complete&&!was){open=firstOpen(d);adv=!!open}
 saveDraft();render();
 if(!was){const ni=ss.findIndex(x=>!x.done);const nx=ni>=0?'Next: set '+(ni+1)+' of '+ss.length:(open?'Next: '+X(open,isAlt(d,open)).n:'');if(nx)startRest(ex.rest,'Rest · '+nx);else $('#timer').hidden=true}
 if(adv){const el=document.getElementById('ex-'+open);el&&setTimeout(()=>el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}),60)}}

document.addEventListener('click',async e=>{const b=e.target.closest('button,[data-close]');if(!b)return;
 if(b.dataset.close!==undefined){closeSheet();return}
 if(b.id==='saveW'){saveWorkout(b);return}
 if(b.id==='rGo'){doRestore();return}
 if(b.dataset.copy!==undefined){try{await navigator.clipboard.writeText(backupText());b.textContent='Copied'}catch(err){b.textContent='Couldn’t copy on this phone'}return}
 if(b.dataset.car){carGo(+b.dataset.car);return}
 if(!main.contains(b))return;
 if(b.dataset.day){day=+b.dataset.day;open=null;edit=null;render();return}
 if(b.dataset.warm!==undefined){const d=getDraft(day);d.warm=!d.warm;d.touched=1;saveDraft();render();return}
 if(b.dataset.open){open=open===b.dataset.open?'':b.dataset.open;edit=null;render();return}
 if(b.dataset.guide){guide(b.dataset.guide);return}
 if(b.dataset.swap){const d=getDraft(day),id=b.dataset.swap;d.alt[id]=!d.alt[id];d.sets[id]=freshSets(X(id,d.alt[id]));d.touched=1;edit=null;saveDraft();render();return}
 if(b.dataset.st){const d=getDraft(day),ex=X(b.dataset.ex,isAlt(d,b.dataset.ex)),i=+b.dataset.i,k=b.dataset.st,s=d.sets[ex.id][i],stp=k==='w'?ex.step:RSTEP[ex.u];
  let v=num(s[k]);v=v==null?(+b.dataset.d>0?stp:0):Math.max(0,+(v+stp*+b.dataset.d).toFixed(2));s[k]=String(v);d.touched=1;const inp=document.getElementById('in-'+ex.id+'-'+i+'-'+k);if(inp)inp.value=k==='w'?fw(v):v;saveDraft();return}
 if(b.dataset.log){logSet(b.dataset.log,+b.dataset.i);return}
 if(b.dataset.edit){edit={ex:b.dataset.edit,i:+b.dataset.i};open=b.dataset.edit;render();return}
 if(b.dataset.untick){const s=getDraft(day).sets[b.dataset.untick][+b.dataset.i];s.done=false;edit=null;saveDraft();render();return}
 if(b.dataset.addset){const ss=getDraft(day).sets[b.dataset.addset],l=ss[ss.length-1];ss.push({w:l.w,r:l.r,done:false});getDraft(day).touched=1;saveDraft();render();return}
 if(b.dataset.home!==undefined){summary=null;render();return}
 if(b.dataset.backup!==undefined){doBackup();return}
 if(b.dataset.restore!==undefined){restoreSheet();return}
 if(b.dataset.del){if(b.dataset.sure){sessions=sessions.filter(s=>s.id!==b.dataset.del);persist();render()}else{b.dataset.sure='1';b.textContent='Tap again to delete for good'}}
});
main.addEventListener('input',e=>{const t=e.target;if(!t.dataset.k)return;const d=getDraft(day);d.sets[t.dataset.ex][+t.dataset.i][t.dataset.k]=t.value.replace(',','.').replace(/[^0-9.]/g,'');d.touched=1;saveDraft()});
main.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('sv'))setTimeout(()=>{try{e.target.select()}catch(x){}},0)});
$('#scrim').onclick=closeSheet;
document.addEventListener('keydown',e=>{if($('#sheet').hidden)return;if(e.key==='Escape')closeSheet();if(e.key==='ArrowRight')carGo(1);if(e.key==='ArrowLeft')carGo(-1)});
$('#finBtn').onclick=finishSheet;
$('#vT').onclick=()=>{view='today';render()};$('#vH').onclick=()=>{view='hist';render()};
window.addEventListener('pagehide',persist);document.addEventListener('visibilitychange',()=>{if(document.hidden)persist()});

load();render();
if(!flag('welcomed'))setTimeout(welcome,400);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}

</script>
</body>
</html>
